[package]
name = "core_native"
version = "0.1.4"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["hardened"]
hardened = []

[profile.release]
opt-level = "z"     # or "3" for perf; "z" reduces size
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo" # nightly/more complex; else strip separately

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
anyhow = "1.0.100"
rand = { version = "0.9.2", features = ["small_rng"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22.1"
object = { version = "0.36", features = ["write"] }
libc = "0.2"
spki = { version = "0.7", features = ["pem"] }
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }
hex = "0.4"
sha2 = "0.10"
walkdir = "2.5"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["std"] }
once_cell = "1.19"
sysinfo = { version = "0.30", default-features = false}
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
elliptic-curve = { version = "0.13", features = ["pem"] }
tempfile = "3"
proptest = "1"

[target."cfg(windows)".dependencies]
goblin = { version = "0.9", features = ["pe32"] }
winreg = "0.55"

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
  "-Clink-arg=/Brepro",
  "-Clink-arg=/incremental:no",
  "-Clink-arg=/SUBSYSTEM:WINDOWS",
]
