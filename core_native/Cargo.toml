[package]
name = "core_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
aead = "0.5.2"
anyhow = "1.0.100"
rand = "0.9.2"
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22.1"
object = "0.36"

[target."cfg(windows)".dependencies]
winreg = "0.55"
