[package]
name = "core_native"
version = "0.1.4"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[features]
default = ["hardened"]
hardened = []

[profile.release]
opt-level = "z"     # or "3" for perf; "z" reduces size
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo" # nightly/more complex; else strip separately

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
aead = "0.5.2"
anyhow = "1.0.100"
rand = { version = "0.9.2", features = ["small_rng"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22.1"
object = { version = "0.36", features = ["write"] }
libc = "0.2"
spki = { version = "0.7", features = ["pem"] }
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }


[dev-dependencies]
elliptic-curve = { version = "0.13", features = ["pem"] }

[target."cfg(windows)".dependencies]
winreg = "0.55"
