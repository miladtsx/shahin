server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-jsonl
    static_configs:
      - targets: ['localhost']
        labels:
          job: app
          __path__: /logs/*.jsonl

    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            message: message
            operation: operation
            duration_ms: duration_ms
            trace_id: trace_id

      - labels:
          level:
          operation:

      - timestamp:
          source: ts
          format: RFC3339Nano
