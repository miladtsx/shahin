<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شاهین — سامانه رهگیری پلاک خودرو</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dashboard.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <a href="https://tally.so/r/nWL0Yv" target="_blank">
        <div class="header">
          <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" />
          <h1>شاهین — سامانه رهگیری پلاک خودرو</h1>
        </div>
      </a>

      <!-- Main Card -->
      <div class="card">
        <!-- Card Header -->
        <div class="card-header">
          <button class="button new-plate" onclick="openAddPlateModal()">
            افزودن
          </button>
          <button class="button toggle-filter" onclick="toggleFilterBar()">
            فیلتر
          </button>
                                <button
                                  class="button icon-button"
                                  title="استخراج CSV"
                                  onclick="exportCSV()"
                                >
                                  ⬇️
                                </button>        </div>

        <!-- Filter Bar -->
        <div id="filterBar" class="filter-bar">
          <div class="filter-buttons">
            <input id="filterPlate" placeholder="جستجوی پلاک" />
            <input id="filterStart" type="datetime-local" />
            <input id="filterEnd" type="datetime-local" />
            <button class="button apply-filter-btn" onclick="applyFilters()">
              فیلتر
            </button>
            <button class="button clear-filter-btn" onclick="clearFilters()">
              &times;
            </button>
          </div>
        </div>

        <!-- Plates Table -->
        <table>
          <thead>
            <tr>
              <th>شناسه</th>
              <th>تصویر</th>
              <th>شماره</th>
              <th>زمان ثبت</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody class="center-text" id="plates_body"></tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination-container">
          <div class="per-page-select">
            <label>
              نمایش در هر صفحه:
              <select id="perPageSelect" onchange="onPerPageChange()">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="100">100</option>
                <option value="200">200</option>
              </select>
            </label>
          </div>

          <div class="pagination-controls">
            <button class="button" id="nextPageBtn" onclick="changePage(1)">
              بعدی
            </button>
            <span id="pageInfo">صفحه 1</span>
            <button class="button" id="prevPageBtn" onclick="changePage(-1)">
              قبلی
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- Image Modal -->
    <div id="imgModal" class="modal" onclick="closePlateImageModal()">
      <img id="modalImg" class="modal-content" />
    </div>

    <!-- Add Plate Modal -->
    <div id="addPlateModal" class="modal">
      <div class="modal-content">
        <h3>ثبت پلاک جدید</h3>
        <input
          id="modal_plate_text"
          maxlength="7"
          maxlength="7"
          placeholder="شماره پلاک را وارد کنید"
        />
        <input id="modal_car_type" placeholder="نوع خودرو را وارد کنید" />
        <input id="modal_car_color" placeholder="رنگ خودرو را وارد کنید" />
        <input id="modal_car_owner" placeholder="نام صاحب خودرو را وارد نمایید" />
        <div class="modal-actions">
          <button
            id="submitBtn"
            class="button new-plate"
            onclick="submitAddPlate()"
          >
            ثبت
          </button>
          <button
            class="button clear-filter-btn"
            onclick="closeAddPlateModal()"
          >
            لغو
          </button>
        </div>
        <span class="modal-close" onclick="closeAddPlateModal()">&times;</span>
      </div>
    </div>

    <!-- Image Details Modal -->
    <div id="imgDetailsModal" class="modal">
      <div class="modal-content">
        <span class="modal-close" onclick="closePlateImageModal()"
          >&times;</span
        >
        <div class="modal-body">
          <img id="modalLargeImg" />
          <div class="modalDetails" id="modalDetails"></div>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
      <div class="modal-content">
        <p id="confirmMessage"></p>
        <!-- <div class="plate-delete-modal"> -->
        <div class="modal-actions">
          <button
            id="confirmYes"
            class="button new-plate"
            onclick="submitAddPlate()"
          >
            بله
          </button>
          <button
            id="confirmNo"
            class="button clear-filter-btn"
            onclick="closeAddPlateModal()"
          >
            خیر
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
      <div class="modal-content">
        <span class="modal-close" onclick="closeSettingsModal()">&times;</span>
        <h3>تنظیمات</h3>
        <div class="settings-container">
          <div class="video-preview-wrapper">
            <img id="videoFeed" src="" alt="Video Preview" />
            <!-- <p>وضعیت سرویس: <span id="backendStatus">نامشخص</span></p> -->
          </div>
          <br />
          <button class="button" id="hotZoneBtn">منطقه تشخیص</button>
          <div class="settings-form-wrapper">
            <div class="settings-form">
              <label
                for="video_path"
                title="مسیر فایل ویدیویی یا آدرس استریم دوربین."
                >آدرس دوربین:</label
              >
              <input
                type="text"
                dir="ltr"
                id="video_path"
                name="video_path"
                oninput="updateVideoStream()"
              />

              <label
                for="frame_skip"
                title="تعداد فریم‌هایی که بین هر پردازش رد می‌شوند."
                >تعداد فریم‌های قابل رد کردن:</label
              >
              <input type="number" id="frame_skip" name="frame_skip" />

              <label
                for="car_detection_threshold"
                title="حداقل اطمینان برای تشخیص خودرو (بین ۰ تا ۱)."
                >حساسیت تشخیص خودرو:</label
              >
              <input
                type="number"
                step="0.1"
                id="car_detection_threshold"
                name="car_detection_threshold"
              />

              <label
                for="plate_detection_threshold"
                title="حداقل اطمینان برای تشخیص پلاک (بین ۰ تا ۱)."
                >حساسیت تشخیص پلاک:</label
              >
              <input
                type="number"
                step="0.1"
                id="plate_detection_threshold"
                name="plate_detection_threshold"
              />

              <label
                for="crop_dimension_threshold"
                title="حداقل ابعاد (عرض یا ارتفاع) برای برش پلاک."
                >آستانه ابعاد برش پلاک:</label
              >
              <input
                type="number"
                id="crop_dimension_threshold"
                name="crop_dimension_threshold"
              />
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="button new-plate" onclick="saveSettings()">
            ذخیره و راه‌اندازی مجدد
          </button>
          <button
            class="button clear-filter-btn"
            onclick="closeSettingsModal()"
          >
            لغو
          </button>
        </div>
      </div>
    </div>

    <!-- Hot Zone Modal -->
    <div id="hotZoneModal" class="modal">
      <div
        class="modal-content"
        style="
          position: relative;
          width: 80%;
          max-width: 1000px;
          aspect-ratio: 16/9;
          margin: auto;
          top: 50%;
          transform: translateY(-50%);
        "
      >
        <span
          class="modal-close"
          onclick="HotZone.close()"
          style="
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            cursor: pointer;
          "
          >&times;</span
        >
        <img
          id="hotZoneImage"
          autoplay
          muted
          style="width: 100%; height: 100%; object-fit: contain"
        />
        <canvas
          id="hotZoneCanvas"
          style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
            cursor: crosshair;
          "
        ></canvas>
        <div
          class="modal-actions"
          style="
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
          "
        >
          <button class="button new-plate" onclick="HotZone.save()">ثبت</button>
          <button class="button clear-filter-btn" onclick="HotZone.close()">
            لغو
          </button>
        </div>
      </div>
    </div>

    <script
      src="{{ url_for('static', filename='dashboard.js') }}"
      defer
    ></script>
  </body>
  <footer>
    © ۱۴۰۴ شاهین &mdash; تمامی حقوق محفوظ می‌باشد.

    <a
      href="https://tally.so/r/nWL0Yv"
      target="_blank"
    >
      ☎
    </a>
    <a href="#" onclick="openSettingsModal()" class="settings-icon">⚙️</a>
  </footer>
</html>
