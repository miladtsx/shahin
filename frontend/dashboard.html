<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شاهین</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dashboard.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" />
        <h1>شاهین &mdash; سامانه رهگیری پلاک خودرو</h1>
      </div>

      <div class="card">
        <div class="card_header">
          <button class="new_plate" onclick="openAddPlateModal()">+</button>
          <button class="toggleFilterBtn" onclick="toggleFilterBar()">
            🔍
          </button>
        </div>

        <div id="filterBar" style="display: none; margin-bottom: 10px">
          <input id="filterPlate" placeholder="جستجوی پلاک" />
          <input id="filterStart" type="datetime-local" />
          <input id="filterEnd" type="datetime-local" />
          <button onclick="applyFilters()">اعمال فیلتر</button>
          <button onclick="clearFilters()">&times;</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>شناسه</th>
              <th>VID</th>
              <th>تصویر</th>
              <th>شماره</th>
              <th>زمان ثبت</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="plates_body"></tbody>
        </table>
      </div>
    </div>

    <div id="toast"></div>

    <div id="imgModal" class="modal" onclick="closePlateImageModal()">
      <img id="modalImg" class="modal_content" />
    </div>

    <!-- Add New Plate Modal -->
    <div id="addPlateModal" class="modal">
      <div class="modal_content">
        <h3>ثبت پلاک جدید</h3>
        <input
          style="margin-right: 35px; margin-top: 35px"
          id="modal_plate_text"
          placeholder="شماره پلاک را وارد کنید"
        />
        <div style="margin-top: 50px; text-align: center">
          <div style="margin-top: 50px; display: flex; gap: 200px">
            <button id="submitBtn" onclick="submitAddPlate()" style="flex: 1">
              ثبت
            </button>
            <button
              onclick="closeAddPlateModal()"
              style="flex: 1; background: #dc3545"
            >
              لغو
            </button>
          </div>
        </div>
        <span onclick="closeAddPlateModal()" class="modal_close">&times;</span>
      </div>
    </div>

    <!-- Image Details Modal -->
    <div id="imgDetailsModal" class="modal">
      <div class="modal-content">
        <span class="modal-close" onclick="closePlateImageModal()"
          >&times;</span
        >
        <div class="modal-body">
          <img id="modalLargeImg" />
          <div id="modalDetails"></div>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
      <div class="plate_delete_modal_container">
        <p
          id="confirmMessage"
          style="margin-bottom: 20px; font-size: x-large"
        ></p>
        <div class="plate_delete_modal">
          <button
            id="confirmYes"
            class="plate_modal_btn"
            style="background: #dc3545"
          >
            بله
          </button>
          <button
            id="confirmNo"
            class="plate_modal_btn"
            style="background: #7c7878"
          >
            خیر
          </button>
        </div>
      </div>
    </div>

    <script
      src="{{ url_for('static', filename='dashboard.js') }}"
      defer
    ></script>
  </body>
</html>
