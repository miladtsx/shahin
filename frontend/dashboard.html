<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شاهین</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dashboard.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" />
        <h1>شاهین &mdash; سامانه رهگیری پلاک خودرو</h1>
      </div>

      <div class="card">
        <div class="card_header">
          <button class="new_plate" onclick="openAddPlateModal()">+</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>شناسه</th>
              <th>VID</th>
              <th>تصویر</th>
              <th>شماره</th>
              <th>زمان ثبت</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="plates_body"></tbody>
        </table>
      </div>
    </div>

    <div id="toast"></div>

    <div id="imgModal" class="modal" onclick="closePlateImageModal()">
      <img id="modalImg" class="modal_content" />
    </div>

    <!-- Add New Plate Modal -->
    <div id="addPlateModal" class="modal">
      <div class="modal_content">
        <h3>ثبت پلاک جدید</h3>
        <input style="margin-right: 35px; margin-top: 35px;" id="modal_plate_text" placeholder="شماره پلاک را وارد کنید" />
        <div style="margin-top: 50px; text-align: center">
          <div style="margin-top: 50px; display: flex; gap: 200px">
            <button id="submitBtn" onclick="submitAddPlate()" style="flex: 1">
              ثبت
            </button>
            <button
              onclick="closeAddPlateModal()"
              style="flex: 1; background: #dc3545"
            >
              لغو
            </button>
          </div>
        </div>
        <span onclick="closeAddPlateModal()" class="modal_close">&times;</span>
      </div>
    </div>

    <!-- Image Details Modal -->
    <div id="imgDetailsModal" class="modal">
      <div class="modal-content">
        <span class="modal-close" onclick="closePlateImageModal()"
          >&times;</span
        >
        <div class="modal-body">
          <img id="modalLargeImg" />
          <div id="modalDetails"></div>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
      <div
        class="modal_content"
        style="
          background: white;
          padding: 20px;
          max-width: 400px;
          border-radius: 8px;
          margin: 15% auto;
        "
      >
        <p id="confirmMessage" style="margin-bottom: 20px"></p>
        <div style="display: flex; justify-content: space-between">
          <button id="confirmYes">تایید</button>
          <button id="confirmNo" style="background: #dc3545">لغو</button>
        </div>
      </div>
    </div>

    <script
      src="{{ url_for('static', filename='dashboard.js') }}"
      defer
    ></script>
  </body>
</html>
